version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - Eye4fraud/platform-engineering
    labels:
      - dependencies
      - go
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - Eye4fraud/platform-engineering
    labels:
      - dependencies
      - frontend
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - Eye4fraud/platform-engineering
    labels:
      - dependencies
      - ci
